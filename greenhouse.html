<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CallMeCatherine ~ Pixel Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Pacifico&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* Sky: blue to green with drifting clouds (from the old greenhouse) */
body{background:linear-gradient(180deg,#b8e8ff 0%,#dff5e3 60%,#c8efd4 100%) fixed !important;}
.page-container{background:rgba(255,255,255,0.5);border-color:rgba(120,200,80,0.4);}
.gh-cloud{position:fixed;z-index:0;background:#fff;border-radius:50px;opacity:.7;animation:ghDrift linear infinite;pointer-events:none;}
.gh-cloud::before,.gh-cloud::after{content:'';position:absolute;background:#fff;border-radius:50%;}
.gh-c1{width:80px;height:24px;top:8%;animation-duration:40s;}
.gh-c1::before{width:40px;height:40px;top:-20px;left:10px;}.gh-c1::after{width:30px;height:30px;top:-14px;left:35px;}
.gh-c2{width:60px;height:18px;top:15%;animation-duration:55s;animation-delay:-20s;}
.gh-c2::before{width:30px;height:30px;top:-16px;left:8px;}.gh-c2::after{width:22px;height:22px;top:-10px;left:28px;}
.gh-c3{width:100px;height:28px;top:5%;animation-duration:70s;animation-delay:-35s;}
.gh-c3::before{width:50px;height:50px;top:-26px;left:12px;}.gh-c3::after{width:36px;height:36px;top:-18px;left:50px;}
@keyframes ghDrift{from{transform:translateX(-150px);}to{transform:translateX(110vw);}}

/* Veggie garden: planting rows of soil, left to right */
.garden-bed{border:3px solid #4a2a08;border-radius:10px;overflow:hidden;background:#5c3410;max-width:760px;margin:0 auto;box-shadow:0 6px 24px rgba(0,0,0,.2);}
.garden-bed .row{align-items:flex-end;gap:8px;padding:10px 12px 12px;margin:0;
  background-image:linear-gradient(180deg,#2e1204 0%,#5a3010 12%,#8a5428 35%,#a86c38 50%,#8a5428 65%,#5a3010 88%,#2e1204 100%);
  border-bottom:6px solid #1a0a02;}
.garden-bed .row:last-child{border-bottom:none;}
.garden-bed img{max-height:64px;}
</style>
</head>
<body>
<div class="gh-cloud gh-c1"></div><div class="gh-cloud gh-c2"></div><div class="gh-cloud gh-c3"></div>

<div class="page-wrap">
  <div id="layout-header"></div>

  <div class="body-layout">
    <div id="layout-sidebar"></div>
    <div class="main-content">

  <div class="page-container">
    <main id="main-content">
      <h2>Greenhouse</h2>
      <hr>
      <div id="greenhouse-sections"></div>
    </main>
  </div>

    </div><!-- end main-content -->
  </div><!-- end body-layout -->

  <div id="layout-footer"></div>
</div>

<script src="sparkle.js"></script>
<script src="layout.js"></script>
<script src="gallery.js"></script>
<script>


var aw='https://artwork.neocities.org',gh='https://gifcities.org/',pb='https://pixelbank.neocities.org',pw='https://pixel-world.tumblr.com',mb='https://myblinkie.holidaycomments.com/gallery';
var BASE='pixels/greenhouse/';

// fromFiles only processes strings; objects with their own href/src are passed through directly
function fromFiles(files,href){
  return files.map(function(f){
    if(typeof f==='object') return f;
    return {href:href,src:BASE+f,alt:f.replace(/\.[^.]+$/,'')};
  });
}

var flowers=fromFiles([
  'divflowera16.gif','lacroixdaisy.gif','lacroixtulip.gif','tulip2.gif','rosa.gif',
  'ikflower08-pinkrose.gif','carnations.png','miniflorzinha.gif','mini066.gif','mini132.gif',
  'mini2.gif','artworkneocities (21).gif','artworkneocities (63).gif',
  'artworkneocities (64).gif','artworkneocities (68).gif','artworkneocities (70).gif',
  'artworkneocities (76).gif','artworkneocities (77).gif','artworkneocities (84).gif',
  'p-i-x-e-l-stumblr (7).gif','darosymaple_sm.png','flower_crate.png','artworkneocities (30).gif',
  'p-i-x-e-l-stumblr (11).gif','p-i-x-e-l-stumblr (12).gif','p-i-x-e-l-stumblr (17).gif','p-i-x-e-l-stumblr (9).gif',
  {href:'https://web.archive.org/web/20060527122705/http://died.altervista.org/',src:'pixels/dolls/doll030.gif',alt:'died_rosarossa'},
  {href:"https://www.pinterest.com/",src:"pixels/greenhouse/pinterest2 (2).jpg",alt:"dandelion kitties"},
],aw);

var potted=fromFiles([
  '0coinplant.png','0monstera.png','4peacelily.png','4violet.png','artworkneocities (3).png',
  'plant1-1.png','artworksucculent.gif','2plant1.gif','2plant5.gif','miniverdura.gif',
  'planta.gif','sprout4.gif','PothosVineTop.png','pixel-worldTUMBLR (2).webp',
  'pixel-worldTUMBLR (3).webp','pixel-worldTUMBLR (4).webp','pixel-worldTUMBLR (5).webp',
  'pixel-worldTUMBLR (6).webp','pixel-worldTUMBLR (7).webp','pixel-worldTUMBLR (8).webp','pixel-worldTUMBLR (9).webp',
],pw);

var trees=fromFiles([
  'bonsai3.gif','TreeStump.gif','grass1.gif',
  'd9kfjom-ccb129ee-45b2-49bc-a37f-c9031b84a77e.png',
  'tumblr_c014b7436bf6af14fb7caf5aca144b46_8173e5b9_250.png',
  'tumblr_inline_o9aoelzNQU1reem51_100.png',
  'd4zkzjc-1c8e16c8-d1f7-4b68-a54a-4fc25a494073.gif',
  'pixelbankneocities (24).gif','pixelbankneocities (47).gif','dalunamoth_sm.png',
  'tumblr_da47253757e47d0c0ca6647ee67acf3a_0ff5346c_250.png',
  {href:"https://www.pinterest.com/",src:"pixels/greenhouse/fromPINTEREST (3).gif",alt:"autumn tree with bench"},
  {href:"https://web.archive.org/web/20060506205737/http://www.yumestudio.it/",src:"pixels/greenhouse/yumestudio-it (4).gif",alt:"big oak tree"},
],pb);

var bugs=fromFiles([
  'butterfly.gif','butterfly_l1_hunny_dot_sunnyday_dot.gif','borbo.gif','bee.gif',
  'bee_001.gif','caracol.gif','2sCaterpillar.gif','garden-frog-lily-pad.gif','196.gif','27.gif',
  {href:"https://cantinhodalumad.blogspot.com/2009/02/borboletas.html",src:"pixels/greenhouse/cantinhodalumad (13).gif",alt:"bee with a heart"},
  {href:"https://cantinhodalumad.blogspot.com/2009/02/borboletas.html",src:"pixels/greenhouse/cantinhodalumad (14).gif",alt:"bee in flowers"},
  {href:"https://cantinhodalumad.blogspot.com/2009/02/borboletas.html",src:"pixels/greenhouse/cantinhodalumad (15).gif",alt:"big bee"},
  {href:"https://cantinhodalumad.blogspot.com/2009/02/borboletas.html",src:"pixels/greenhouse/cantinhodalumad (16).gif",alt:"beehive"},
  {href:"https://cantinhodalumad.blogspot.com/2009/02/borboletas.html",src:"pixels/greenhouse/cantinhodalumad (1).gif",alt:"blue butterfly"},
  {href:"https://cantinhodalumad.blogspot.com/2009/02/borboletas.html",src:"pixels/greenhouse/cantinhodalumad (27).gif",alt:"yellow butterflies"},
  {href:"https://cantinhodalumad.blogspot.com/2009/02/borboletas.html",src:"pixels/greenhouse/cantinhodalumad (28).gif",alt:"lilac butterfly"},
  {href:"https://cantinhodalumad.blogspot.com/2009/02/borboletas.html",src:"pixels/greenhouse/cantinhodalumad (32).gif",alt:"tiny butterflies"},
  {href:"https://cantinhodalumad.blogspot.com/2009/02/borboletas.html",src:"pixels/greenhouse/cantinhodalumad (33).gif",alt:"pink butterfly"},
  {href:"https://cantinhodalumad.blogspot.com/2009/02/borboletas.html",src:"pixels/greenhouse/cantinhodalumad (34).gif",alt:"green butterfly"},
  {href:"https://cinni.net/?z=/toybox/ani",src:BASE+'neskaya.net_frog5.gif',alt:''},
  {href:"https://cantinhodalumad.blogspot.com/2009/02/borboletas.html",src:"pixels/greenhouse/cantinhodalumad (30).gif",alt:"sparkly pink butterfly"},
  {href:"https://cantinhodalumad.blogspot.com/2009/02/borboletas.html",src:"pixels/greenhouse/cantinhodalumad (29).gif",alt:"swallowtails"},
],aw);

var mushrooms=[
  {href:mb, src:BASE+'mushroom.gif',   alt:'mushroomingrass'},
  {href:aw, src:BASE+'kinoko16.gif',   alt:'kinoko16'},
  {href:aw, src:BASE+'th_mini108.gif', alt:'th_mini108'},
  {href:"https://stephology.ca/",src:"pixels/greenhouse/stephology (2).gif",alt:"mushroom island"},
];

var veggies=fromFiles([
  'corn.gif','potato.gif','turnip.gif','garlic1.gif','icon-carrot.gif',
  '2blueberries.png','watermelon.gif','water_can.gif','gnome2.gif','gnome3.gif','sign2.gif','sign4.gif',
  {href:"https://stephology.ca/",src:"pixels/greenhouse/stephology (5).gif",alt:"orange"},
  {href:"https://cinni.net/?z=/toybox/ani",src:BASE+'neskaya.net_strawb13.gif',alt:''},
  {href:"https://web.archive.org/web/20100419011152/http://neskaya.net/pixels.php?",src:BASE+'pix (2).gif',alt:''},
  {href:gh,src:BASE+'adoptedpixelredapple.gif',alt:''},
  {href:"https://web.archive.org/web/20091027140656/http://www.geocities.com/EnchantedForest/9425/mauph.html",src:"pixels/other/enchantedforest/garden.gif",alt:"vegetable rows"},
],aw);

var sections=[
  {label:"Flowers & Blooms",  items:flowers},
  {label:"Potted Plants",     items:potted},
  {label:"Trees & Greenery",  items:trees},
  {label:"Bugs & Critters",   items:bugs},
  {label:"Mushrooms & Fungi", items:mushrooms},
  {label:"Veggie Garden",     items:veggies},
];


Gallery.sections('greenhouse-sections',sections,{max:200,min:50});
// Lay the veggie garden out in rows of soil
(function(){
  var sec=[...document.querySelectorAll('#greenhouse-sections .gallery-section')].find(function(s){return /Veggie/.test(s.querySelector('.section-title').getAttribute('aria-label'));});
  if(!sec) return;
  var shelf=sec.querySelector('.shelf'), row=shelf.querySelector('.row'), links=[...row.children], per=7;
  shelf.innerHTML=''; shelf.classList.add('garden-bed');
  for(var i=0;i<links.length;i+=per){var r=document.createElement('div');r.className='row';links.slice(i,i+per).forEach(function(l){r.appendChild(l);});shelf.appendChild(r);}
})();
</script>
</body>
</html>
