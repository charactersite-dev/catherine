<script>
const BASE = '../../pixels/greenhouse/';
const MIN = 50, MAX = 200;

const sizeImg = (el) => {
  let w = el.naturalWidth, h = el.naturalHeight;
  if (w === 0 || h === 0) return;
  if (w < MIN && h < MIN) { const scale = MIN / Math.min(w, h); w = Math.round(w * scale); h = Math.round(h * scale); }
  else if (w < MIN) { const scale = MIN / w; w = MIN; h = Math.round(h * scale); }
  else if (h < MIN) { const scale = MIN / h; h = MIN; w = Math.round(w * scale); }
  if (w > MAX && h > MAX) { const scale = MAX / Math.max(w, h); w = Math.round(w * scale); h = Math.round(h * scale); }
  else if (h > MAX) { const scale = MAX / h; h = MAX; w = Math.round(w * scale); }
  else if (w > MAX) { const scale = MAX / w; w = MAX; h = Math.round(h * scale); }
  el.width = w; el.height = h;
};

const img = (src, _hint, title) => {
  const el = document.createElement('img');
  el.src = BASE + src;
  if (title) el.title = title;
  if (el.complete && el.naturalWidth) sizeImg(el);
  else el.onload = () => sizeImg(el);
  return el;
};

const load = (id, arr) => {
  const el = document.getElementById(id);
  if (!el) return;
  arr.forEach(([src, h, label]) => el.appendChild(img(src, h, label)));
};

const flowers = [

  ['artworkneocities (21).gif',40,'flower gif'],['artworkneocities (30).gif',48,'flower 2'],
  ['artworkneocities (63).gif',40,'flower 3'],['artworkneocities (64).gif',48,'flower 4'],
  ['artworkneocities (68).gif',32,'flower 5'],['artworkneocities (70).gif',32,'flower 6'],
  ['artworkneocities (76).gif',40,'flower 7'],['artworkneocities (77).gif',40,'flower 8'],

  ['ico6.gif',24,'icon flower'],['ico8.gif',24,'icon flower 2'],['mini111.gif',20,'tiny flower'],

  ['4violet.png',40,'violet'],['artworkneocities (3).png',32,'potted plant'],['plant1-1.png',56,'plant big'],
  ['artworksucculent.gif',40,'succulent'],['2plant1.gif',32,'plant gif 1'],['2plant5.gif',32,'plant gif 5'],
  ['miniverdura.gif',24,'mini plant'],['planta.gif',20,'tiny plant'],['sprout4.gif',28,'sprout'],
  ['PothosVineTop.png',48,'pothos vine'],['pixel-worldTUMBLR (2).webp',40,'pixel world plant 2'],

const veggies = [['corn.gif','corn'],['potato.gif','potato'],['turnip.gif','turnip'],['garlic1.gif','garlic'],['icon-carrot.gif','carrot']];
const veggieEmoji = ['🌽','🥕','🥔','🧄','🌿','🫛','🥦','🫚'];
const fruits = [['2blueberries.png','blueberries'],['watermelon.gif','watermelon']];
const fruitEmoji = ['🍓','🫐','🍉','🍇','🍒','🍑','🍋','🍎'];
const other = [['water_can.gif','watering can'],['gnome2.gif','gnome 2'],['gnome3.gif','gnome 3'],['sign2.gif','sign 2'],['sign4.gif','sign 4'],['mini2.gif','mini deco'],['th_mini065.gif','tiny deco']];
const otherEmoji = ['🪣','🌻','🪴','🧺','🪱','🌾','🍂','🪵'];

const half = arr => { const mid = Math.ceil(arr.length / 2); return [arr.slice(0, mid), arr.slice(mid)]; };
const sortLargeToEnd = col => { const imgs = [...col.querySelectorAll('img')]; const large = imgs.filter(i => i.height >= MAX || i.width >= MAX); large.forEach(i => col.appendChild(i)); };
const buildCol = (items, emojis) => {
  const col = document.createElement('div');
  col.className = 'dirt-col';
  let loaded = 0;
  items.forEach(([src, title]) => {
    const el = document.createElement('img');
    el.src = BASE + src;
    if (title) el.title = title;
    const onDone = () => { sizeImg(el); loaded++; if (loaded === items.length) sortLargeToEnd(col); };
    if (el.complete && el.naturalWidth) onDone();
    else el.onload = onDone;
    col.appendChild(el);
  });
  if (emojis && emojis.length) {
    emojis.forEach(e => {
      const span = document.createElement('span');
      span.style.cssText = 'font-size:1.2rem;line-height:1;display:block;text-align:center;';
      span.textContent = e;
      col.appendChild(span);
    });
  }
  return col;
};

const field = document.getElementById('dirt-field');
const [veggiesA, veggiesB] = half(veggies);
const [fruitsA, fruitsB]   = half(fruits);
const [otherA,  otherB]    = half(other);
const [emojiVA, emojiVB]   = half(veggieEmoji);
const [emojiFА, emojiFB]   = half(fruitEmoji);
const [emojiOA, emojiOB]   = half(otherEmoji);
[[veggiesA,emojiVA],[veggiesB,emojiVB],[fruitsA,emojiFА],[fruitsB,emojiFB],[otherA,emojiOA],[otherB,emojiOB]]
  .forEach(([items, emojis]) => field.appendChild(buildCol(items, emojis)));

const headerDeco = [
  ['miniflorzinha.gif',20,''],['bee.gif',20,''],['tulip2.gif',28,''],
  ['bee_001.gif',22,''],['miniflorzinha.gif',20,''],['mini132.gif',18,''],['sprout4.gif',24,''],
];
const scenes = [
  ['shelf-flowers', flowers],['shelf-potted', potted],['shelf-trees', trees],
  ['shelf-bugs', bugs],['shelf-mushrooms', mushrooms],['headerDeco', headerDeco],
];
scenes.forEach(([id, arr]) => load(id, arr));

document.getElementById('pixel-nav-toggle').addEventListener('click', function() {
  document.getElementById('pixel-nav').classList.toggle('open');
});

(function() {
  var cur = window.location.pathname.replace(/\/$/, '').split('/').pop() || 'index';
  document.querySelectorAll('#pixel-nav-links a').forEach(function(a) {
    var page = (a.getAttribute('href') || '').replace(/\/$/, '').split('/').pop() || 'index';
    if (page === cur) { a.style.background = 'rgba(74,124,32,.28)'; a.style.fontWeight = '700'; }
  });
})();
