<script>
/* ── SPAN LOGIC ── */
const CELL = 72, GAP = 6;
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function spansFor(px) {
  if (px <= CELL)            return 1;
  if (px <= CELL * 2 + GAP) return 2;
  return 3;
}
function applySpans(img) {
  const cubby = img.closest('.cubby');
  if (!cubby) return;
  let nw = img.naturalWidth, nh = img.naturalHeight;
  if (!nw || !nh) return;
  const MIN = 50, MAX = img.dataset.max ? parseInt(img.dataset.max,10) : 200;
  if (nw < MIN) { const s=MIN/nw; nw=MIN; nh=Math.round(nh*s); }
  if (nh > MAX) { const s=MAX/nh; nh=MAX; nw=Math.round(nw*s); }
  if (nw > MAX) { const s=MAX/nw; nw=MAX; nh=Math.round(nh*s); }
  img.width=nw; img.height=nh;
  const cs=spansFor(nw), rs=spansFor(nh);
  if (cs > 1) cubby.style.gridColumn=`span ${cs}`;
  if (rs > 1) cubby.style.gridRow=`span ${rs}`;
}
window.addEventListener('load', () => {
  document.querySelectorAll('.tray .cubby img').forEach(img => {
    if (img.complete && img.naturalWidth) applySpans(img);
    else img.addEventListener('load', () => applySpans(img));
  });
});

/* ── CABINET BUILDER ── */
function buildCabinet(id, cols, rows, items) {
  const tray = document.getElementById(id);
  if (!tray) return;
  tray.style.gridTemplateColumns = `repeat(${cols},var(--cell))`;
  tray.style.gridTemplateRows    = `repeat(${rows},var(--cell))`;

  const total = cols * rows;
  items.forEach(item => {
    const div = document.createElement('div');
    if (!item) {
      div.className = 'cubby white cubby-empty';
      div.innerHTML = '<span class="placeholder-heart">♡</span>';
    } else {
      div.className = 'cubby white';
      const a = document.createElement('a');
      a.href = item.href || '#';
      const img = document.createElement('img');
      img.src = item.src;
      img.alt = item.alt || '';
      if (item.max) img.dataset.max = item.max;
      a.appendChild(img);
      div.appendChild(a);
    }
    tray.appendChild(div);
  });

  const filled = items.length;
  for (let i = filled; i < total; i++) {
    const div = document.createElement('div');
    div.className = 'cubby white cubby-empty';
    div.innerHTML = '<span class="placeholder-heart">♡</span>';
    tray.appendChild(div);
  }
}
