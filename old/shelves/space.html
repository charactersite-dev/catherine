<script>
// ── SPRITES
const BASE = '../../pixels/space/';
const sprites = [
  ['1ESPLOSIONstaradopt.gif',    64],
  ['artworkneocities (15).gif',  56],
  ['bedtime-star.gif',           72],
  ['c9dda7c7.gif',               56],
  ['i4.gif',                     56],
  ['minisol.gif',                56],
  ['moon-nighttime.gif',         96],
  ['pixel-worldTUMBLR (1).webp', 64],
  ['pixel-worldTUMBLR (13).webp',56],
  ['pixel-worldTUMBLR (14).webp',56],
  ['pixel-worldTUMBLR (15).webp',56],
  ['pixel-worldTUMBLR (16).webp',64],
  ['pixelbankneocities (8).gif', 56],
  ['thegardenofmadeline.gif',    64],
];

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
shuffle(sprites);

const field = document.getElementById('spriteField');
const placed = [];
function noOverlap(a, b) { return a.x + a.w + 10 < b.x || b.x + b.w + 10 < a.x || a.y + a.h + 10 < b.y || b.y + b.h + 10 < a.y; }

sprites.forEach(([src, h]) => {
  const el = document.createElement('img');
  el.src = BASE + src;
  el.style.height = h + 'px';
  el.title = src;
  el.onload = function() {
    const w = el.offsetWidth || h;
    const vw = innerWidth, vh = innerHeight;
    let tx, ty, found = false;
    for (let i = 0; i < 80; i++) {
      tx = Math.round((0.04 + Math.random() * 0.88) * (vw - w));
      ty = Math.round((0.06 + Math.random() * 0.80) * (vh - h));
      const box = {x:tx, y:ty, w, h};
      if (placed.every(p => noOverlap(box, p))) { placed.push(box); found = true; break; }
    }
    if (!found) { tx = Math.round(Math.random() * (vw - w)); ty = Math.round(Math.random() * (vh - h)); }
    el.style.left = tx + 'px';
    el.style.top = ty + 'px';
  };
  field.appendChild(el);
});

document.getElementById('pixel-nav-toggle').addEventListener('click', function() {
  document.getElementById('pixel-nav').classList.toggle('open');
});

(function() {
  var cur = window.location.pathname.replace(/\/$/, '').split('/').pop() || 'index';
  document.querySelectorAll('#pixel-nav-links a').forEach(function(a) {
    var page = (a.getAttribute('href') || '').replace(/\/$/, '').split('/').pop() || 'index';
    if (page === cur) { a.style.background = 'rgba(96,64,192,.35)'; a.style.fontWeight = '700'; }
  });
})();
</script>
