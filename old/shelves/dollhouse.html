<script>
document.getElementById('pixel-nav-toggle').addEventListener('click', function() {
  document.getElementById('pixel-nav').classList.toggle('open');
});

(function() {
  var cur = window.location.pathname.replace(/\/$/, '').split('/').pop() || 'index';
  document.querySelectorAll('#pixel-nav-links a').forEach(function(a) {
    var page = (a.getAttribute('href') || '').replace(/\/$/, '').split('/').pop() || 'index';
    if (page === cur) { a.style.background = 'rgba(144,96,192,.28)'; a.style.fontWeight = '700'; }
  });
})();

/* Image sizing — runs on load */
window.addEventListener('load', function() {
  const MIN = 50, MAX = 200;
  function sizeImg(el) {
    let w = el.naturalWidth, h = el.naturalHeight;
    if (!w || !h) return;
    if (w < MIN) { const s = MIN / w; w = MIN; h = Math.round(h * s); }
    if (h > MAX) { const s = MAX / h; h = MAX; w = Math.round(w * s); if (w > MAX) { w = MAX; } }
    el.width = w; el.height = h;
  }
  document.querySelectorAll('.grid img, .shelf-topcap img, .shelf-bottomcap img, .page-header img').forEach(function(img) {
    if (img.complete && img.naturalWidth) sizeImg(img);
    else img.addEventListener('load', function() { sizeImg(img); });
  });
});
</script>
