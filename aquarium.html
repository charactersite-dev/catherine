<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CallMeCatherine ~ Pixel Aquarium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Pacifico&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
body{background:linear-gradient(180deg,#a8e4f0 0%,#5ab8d8 20%,#2a8ab8 45%,#1060a0 70%,#083878 100%) !important;background-attachment:fixed !important;}
.page-container{background:rgba(0,40,80,0.45);border-color:rgba(100,200,255,0.35);color:#d0f0ff;}
.page-container h2{color:#80d8ff;}
hr{background:rgba(100,200,255,0.2) !important;}
#bubbles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:-1;overflow:hidden;}
@keyframes riseUp{0%{transform:translateY(0) translateX(0);opacity:.8;}50%{transform:translateY(-50vh) translateX(var(--sway,8px));opacity:.6;}100%{transform:translateY(-110vh) translateX(0);opacity:0;}}
.bubble{position:absolute;bottom:-40px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,0.7),rgba(160,220,255,0.2));border:1px solid rgba(255,255,255,0.5);animation:riseUp var(--dur,8s) ease-in infinite var(--del,0s);}
</style>
</head>
<body>
<div id="bubbles"></div>

<div class="page-wrap">
  <div id="layout-header"></div>

  <div class="body-layout">
    <div id="layout-sidebar"></div>
    <div class="main-content">

  <div class="page-container">
    <main id="main-content">
      <h2>Pixel Aquarium</h2>
      <hr>
      <img loading="lazy" decoding="async" src="pixels/aqua/gifcities22 (8).gif" alt="" class="pixel">

      <section class="gallery-section">
        <div class="section-title" data-letters="Beach"></div>
        <div id="beach-container"></div>
        <img loading="lazy" decoding="async" src="pixels/dividers/gifcitiesorg1 (47).gif" alt="" class="pixel">
      </section>
      <section class="gallery-section">
        <div class="section-title" data-letters="Under the Sea"></div>
        <div id="aquarium-container"></div>
      </section>
      <section class="gallery-section">
        <div class="section-title" data-letters="Deep Sea"></div>
        <div id="deepsea-container"></div>
      </section>
      <section class="gallery-section">
        <div class="section-title" data-letters="Sea Floor"></div>
        <div id="seafloor-container"></div>
        <img loading="lazy" decoding="async" src="pixels/dividers/artworkneocities (83).gif" alt="" class="pixel">
      </section>
    </main>
  </div>

    </div><!-- end main-content -->
  </div><!-- end body-layout -->

  <div id="layout-footer"></div>
</div>

<script src="sparkle.js"></script>
<script src="layout.js"></script>
<script src="gallery.js"></script>
<script>
// Bubbles
(function(){
  var c=document.getElementById('bubbles');
  for(var i=0;i<22;i++){
    var b=document.createElement('div');b.className='bubble';
    var sz=4+Math.random()*18;
    b.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+(Math.random()*100)+'%;--dur:'+(5+Math.random()*10)+'s;--del:'+(-Math.random()*12)+'s;--sway:'+(Math.random()*20-10)+'px;';
    c.appendChild(b);
  }
})();

var sd="https://sakuradreams.neocities.org/",aw="https://artwork.neocities.org",gc="https://gifcities.org/",pg="https://pixel-garden.tumblr.com";
var beach=[{href:gc,src:"pixels/aqua/gifcities22 (6).gif",alt:""},{href:sd,src:"pixels/aqua/Dolphin05.gif",alt:""}];
var aquarium=[
  // little fish
  {href:sd,src:"pixels/aqua/04.gif",alt:"clownfish"},{href:sd,src:"pixels/aqua/05.gif",alt:"yellow angelfish"},{href:sd,src:"pixels/aqua/Fish03.gif",alt:"pufferfish"},
  {href:aw,src:"pixels/aqua/artworkneocities (10).gif",alt:"sparkly fish"},{href:aw,src:"pixels/aqua/artworkneocities (67).gif",alt:"purple fish"},
  {href:gc,src:"pixels/aqua/gifcities22 (15).gif",alt:"tiny fish"},
  {break:true},
  // turtles, rays and dolphins
  {href:sd,src:"pixels/aqua/06.gif",alt:"sea turtle"},{href:sd,src:"pixels/aqua/13.gif",alt:"blue ray"},
  {href:gc,src:"pixels/aqua/astronauta1.gif",alt:"purple dolphin"},{href:pg,src:"pixels/aqua/pixel-gardenTUMBLR (1).gif",alt:"blue dolphin"},{href:sd,src:"pixels/aqua/Dolphin03.gif",alt:"pink and blue dolphins"},
];
var deepSea=[{src:"pixels/other/RL54GC7Z5IJZK3JEL3XW3OCIBKHVUCNR.gif",alt:"bubbles"},{src:"pixels/other/bubbles.gif",alt:"bubbles"},{href:sd,src:"pixels/aqua/Fish05.gif",alt:"school of orange fish"},{href:sd,src:"pixels/aqua/Fish06.gif",alt:"school of rainbow fish"},{href:"https://canva.com",src:"pixels/aqua/jellyfish.png",alt:"jellyfish"}];
var seaFloor=[{href:sd,src:"pixels/aqua/Ray01.gif",alt:"ray on the sand"},
  {href:gc,src:"pixels/aqua/gifcities22 (7).gif",alt:"starfish"},{href:aw,src:"pixels/aqua/artworkneocities (90).gif",alt:"hermit crab"},
  {href:sd,src:"pixels/aqua/Shell04.gif",alt:"pink shell"},{href:aw,src:"pixels/aqua/artworkneocities (24).gif",alt:"pink clam"},
  {href:gc,src:"pixels/aqua/pinterest2 (11).webp",alt:"shipwreck"},{href:gc,src:"pixels/aqua/gifcities22 (5).gif",alt:"striped fish"},
];
var opts={max:200,min:30};
Gallery.shelf('beach-container',beach,opts);
Gallery.shelf('aquarium-container',aquarium,opts);
Gallery.shelf('deepsea-container',deepSea,opts);
Gallery.shelf('seafloor-container',seaFloor,opts);
</script>
</body>
</html>
