<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CallMeCatherine ~ Guestbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Pacifico&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stars"></div>
<div id="clouds"></div>

<div class="page-wrap">
  <div id="layout-header"></div>

  <div class="body-layout">
    <div id="layout-sidebar"></div>
    <div class="main-content">

      <div class="page-container">
        <main id="main-content">
          <h2>Guestbook</h2>
          <hr>
          <div class="book">
            <div class="book-page book-left">
              <div class="book-title">♡ Guestbook ♡</div>
              <p class="book-text">Thank you for visiting my little corner of the web! Leave me a message, say hi, or tell me your favorite pixel ~</p>
              <img src="pixels/blinkies/gifcities (24).gif" alt="" class="book-deco">
              <p class="book-sign">♡ Catherine</p>
            </div>
            <div class="book-page book-right">
              <iframe title="Guestbook" loading="lazy" src="https://www3.cbox.ws/box/?boxid=3553459&boxtag=79WvRB" allowtransparency="yes" allow="autoplay" frameborder="0" scrolling="auto"></iframe>
            </div>
          </div>
        </main>
      </div>

    </div><!-- end main-content -->
  </div><!-- end body-layout -->

  <div id="layout-footer"></div>
</div>

<script src="sparkle.js"></script>
<script src="layout.js"></script>

</body>
</html>
