const peopleContainer=document.getElementById('people-sections');
let idx=0;
for(const [label,items] of Object.entries(scenes)){
  if(idx>0){const d=document.createElement('div');d.innerHTML='<br><hr><br>';peopleContainer.appendChild(d);}
  idx++;
  const sec=document.createElement('section');
  const letters=label.split('').map((c,i)=>c===' '?'<span style="display:inline-block;width:5px"></span>':`<span class="letter" style="--i:${i}">${c}</span>`).join('');
  sec.innerHTML=`<div class="section-title">${letters}</div><div></div>`;
  peopleContainer.appendChild(sec);
  const shelf=sec.querySelector('div:last-child');
  items.forEach(([href,src,alt])=>{
    const a=document.createElement('a');a.href=href;a.target='_blank';a.rel='noopener';
    const img=document.createElement('img');img.src=src;img.alt=alt;img.loading='lazy';
    img.onerror=()=>img.parentElement.style.display='none';
    a.appendChild(img);shelf.appendChild(a);
  });
}

function resizeImage(img){const max=300,min=30,w=img.naturalWidth,h=img.naturalHeight;if(!w||!h)return;const sd=Math.min(max/w,max/h,1),su=Math.max(min/w,min/h,1);let sc=1;if(w>max||h>max)sc=sd;if(w<min||h<min)sc=su;img.style.width=w*sc+'px';img.style.height=h*sc+'px';}
window.addEventListener('load',()=>peopleContainer.querySelectorAll('img').forEach(img=>{if(img.complete)resizeImage(img);else img.onload=()=>resizeImage(img);}));
