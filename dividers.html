<script>
(function(){
  var S=document.getElementById('stars'),C=document.getElementById('clouds');
  for(var i=0;i<28;i++){var s=document.createElement('div');var sz=(1.5+Math.random()*2.5).toFixed(1),lo=(0.2+Math.random()*0.35).toFixed(2);s.style.cssText='position:absolute;width:'+sz+'px;height:'+sz+'px;border-radius:50%;background:white;left:'+(Math.random()*100).toFixed(1)+'%;top:'+(Math.random()*45).toFixed(1)+'%;--lo:'+lo+';--hi:1;animation:twinkle '+(2+Math.random()*3).toFixed(1)+'s ease-in-out infinite '+(-Math.random()*4).toFixed(1)+'s;';S.appendChild(s);}
