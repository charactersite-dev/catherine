const container=document.getElementById('dividers');
dividerSections.forEach(sec=>{
  const section=document.createElement('section');
  section.className='gallery-section';
  section.innerHTML='<div class="section-title" aria-label="'+sec.label+'">'+makeLetters(sec.label)+'</div>';
  sec.items.forEach(item=>{
    const a=document.createElement('a');
    a.href=item.href||'#';a.target='_blank';a.rel='noopener';a.className='divider-link';
    const img=document.createElement('img');img.src=item.src;img.alt=item.alt||'';img.loading='lazy';img.decoding='async';
    a.appendChild(img);section.appendChild(a);
  });
  container.appendChild(section);
});
