function renderArray(arr,id){
  var c=document.getElementById(id);if(!c)return;
  var row=document.createElement('div');row.className='row';c.appendChild(row);
  arr.forEach(function(item){
    if(item.break){row=document.createElement('div');row.className='row';c.appendChild(row);return;}
    var a=document.createElement('a');a.href=item.href||'#';a.target='_blank';
    var img=document.createElement('img');img.src=item.src;img.alt=item.alt||'';img.loading='lazy';
    attachR(img);a.appendChild(img);row.appendChild(a);
  });
}

  var container=document.getElementById('dollhouse-sections');
  dollhouseSections.forEach(function(s,idx){
    if(idx>0){var d=document.createElement('div');d.innerHTML='<br><hr><br>';container.appendChild(d);}
    var id='shelf-'+s.label.replace(/\W+/g,'-').toLowerCase();
    var sec=document.createElement('section');
    sec.innerHTML='<div class="section-title">'+makeLetters(s.label)+'</div><div id="'+id+'"></div>';
    container.appendChild(sec);
    renderArray(s.items,id);
  });
