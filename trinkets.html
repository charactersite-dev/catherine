  const MAX_IMG = 300, MIN_IMG = 30;
  function resizeImg(img) {
    const w = img.naturalWidth, h = img.naturalHeight;
    if (!w || !h) return;
    const shrink = Math.min(MAX_IMG / w, MAX_IMG / h, 1);
    const grow = Math.max(MIN_IMG / w, MIN_IMG / h, 1);
    const scale = (w > MAX_IMG || h > MAX_IMG) ? shrink : (w < MIN_IMG || h < MIN_IMG) ? grow : 1;
    img.style.width = (w * scale) + 'px';
    img.style.height = (h * scale) + 'px';
  }
  function attachResize(img) {
    if (img.naturalWidth > 0) resizeImg(img);
    else if (img.complete) setTimeout(() => attachResize(img), 50);
    else img.onload = () => resizeImg(img);
  }

  function renderArray(array, containerId) {
    const container = document.getElementById(containerId);
    if (!container) return;
    let row = document.createElement("div");
    row.className = "row";
    container.appendChild(row);
    array.forEach(item => {
      if (item.break) {
        row = document.createElement("div");
        row.className = "row";
        container.appendChild(row);
        return;
      }
      const link = document.createElement(item.href ? "a" : "span");
      if (item.href) { link.href = item.href; link.target = "_blank"; link.rel = "noopener"; }
      const img = document.createElement("img");
      img.src = item.src;
      img.alt = item.alt || "";
      img.loading = "lazy";
      attachResize(img);
      link.appendChild(img);
      row.appendChild(link);
    });
  }

  // ════════════════════════════════════════════════════
  // RENDER HELPERS
  // ════════════════════════════════════════════════════

  function makeLetters(label) {
    return label.split('').map((c, i) =>
      c === ' '
        ? `<span style="display:inline-block;width:5px"></span>`
        : `<span class="letter" style="--i:${i}">${c}</span>`
    ).join('');
  }

  function makeContentBox(titleText) {
    const box = document.createElement('div');
    box.className = 'content-box';
    if (titleText) {
      const title = document.createElement('div');
      title.className = 'section-title';
      title.innerHTML = makeLetters(titleText);
      box.appendChild(title);
      const hr = document.createElement('hr');
      box.appendChild(hr);
      const br = document.createElement('br');
      box.appendChild(br);
    }
    return box;
  }

  function addSection(container, label, items, shelfId) {
    const sec = document.createElement('section');
    const title = document.createElement('div');
    title.className = 'section-title';
    title.innerHTML = makeLetters(label);
    const shelf = document.createElement('div');
    shelf.id = shelfId;
    sec.appendChild(title);
    sec.appendChild(shelf);
    container.appendChild(sec);
    renderArray(items, shelfId);
  }

  function addDivider(container) {
    const d = document.createElement('div');
    d.innerHTML = '<br><hr><br>';
    container.appendChild(d);
  }

  // ════════════════════════════════════════════════════
  // BUILD PAGE
  // ════════════════════════════════════════════════════
  window.addEventListener('DOMContentLoaded', () => {
    const wrapper = document.getElementById('trinkets-wrapper');

    // ── Title box ──
    const titleBox = makeContentBox(null);
    titleBox.innerHTML = `
      <h2>Trinkets</h2>
      <hr>
    `;
    wrapper.appendChild(titleBox);


    // ── Favorites ──
    const favBox = makeContentBox('Favorites');
    const favShelf = document.createElement('div');
    favShelf.id = 'shelf-favorites';
    favBox.appendChild(favShelf);
    wrapper.appendChild(favBox);
    renderArray(FAVORITES, 'shelf-favorites');

    // ── Fandoms (one box, sub-sections inside) ──
    const fanBox = makeContentBox('Fandoms');
    wrapper.appendChild(fanBox);

    const fandomSubs = [
      ['Lisa Frank',           FANDOMS_LISAFRANK,  'shelf-lisafrank'],
      ['Care Bears',           FANDOMS_CAREBEARS,  'shelf-carebears'],
      ['Disney',               FANDOMS_DISNEY,     'shelf-disney'],
      ['Hello Kitty & Sanrio', FANDOMS_SANRIO,     'shelf-sanrio'],
      ['Mario',                FANDOMS_MARIO,      'shelf-mario'],
      ['My Little Pony',       FANDOMS_MLP,        'shelf-mlp'],
      ['Neopets',              FANDOMS_NEOPETS,    'shelf-neopets'],
      ['Pokemon & Digimon',    FANDOMS_POKEMON,    'shelf-pokemon'],
      ['Sailor Moon',          FANDOMS_SAILORMOON, 'shelf-sailormoon'],
      ['Other',                FANDOMS_OTHER,      'shelf-fandoms-other'],
    ];
    fandomSubs.forEach(([label, items, id], idx) => {
      if (idx > 0) addDivider(fanBox);
      addSection(fanBox, label, items, id);
    });

    // ── Remaining top-level sections — each its own box ──
    const topSections = [
      ['Food & Drinks',    FOOD,     'shelf-food'],
      ['Animals',          ANIMALS,  'shelf-animals'],
      ['Fantasy',          FANTASY,  'shelf-fantasy'],
      ['Objects',          OBJECTS,  'shelf-objects'],
      ['Seasons & Nature', SEASONS,  'shelf-seasons'],
      ['Miscellaneous',    MISC,     'shelf-misc'],
      ['Toys',             TOYS,     'shelf-toys'],
      ['Uncategorized',    UNSORTED, 'shelf-unsorted'],
    ];
    topSections.forEach(([label, items, id]) => {
      const box = makeContentBox(label);
      const shelf = document.createElement('div');
      shelf.id = id;
      box.appendChild(shelf);
      wrapper.appendChild(box);
      renderArray(items, id);
    });
  });
