<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CallmeCatherine ~ Greenhouse</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script type="text/javascript">
// <![CDATA[
var colour="random";
var sparkles=50;
var x=ox=400;
var y=oy=300;
var swide=800;
var shigh=600;
var sleft=sdown=0;
var tiny=new Array();
var star=new Array();
var starv=new Array();
var starx=new Array();
var stary=new Array();
var tinyx=new Array();
var tinyy=new Array();
var tinyv=new Array();

window.onload=function() { if (document.getElementById) {
  var i, rats, rlef, rdow;
  for (var i=0; i<sparkles; i++) {
    var rats=createDiv(3, 3);
    rats.style.visibility="hidden";
    rats.style.zIndex="999";
    document.body.appendChild(tiny[i]=rats);
    starv[i]=0;
    tinyv[i]=0;
    var rats=createDiv(5, 5);
    rats.style.backgroundColor="transparent";
    rats.style.visibility="hidden";
    rats.style.zIndex="999";
    var rlef=createDiv(1, 5);
    var rdow=createDiv(5, 1);
    rats.appendChild(rlef);
    rats.appendChild(rdow);
    rlef.style.top="2px";
    rlef.style.left="0px";
    rdow.style.top="0px";
    rdow.style.left="2px";
    document.body.appendChild(star[i]=rats);
  }
  set_width();
  sparkle();
}}

function sparkle() {
  var c;
  if (Math.abs(x-ox)>1 || Math.abs(y-oy)>1) {
    ox=x; oy=y;
    for (c=0; c<sparkles; c++) if (!starv[c]) {
      star[c].style.left=(starx[c]=x)+"px";
      star[c].style.top=(stary[c]=y+1)+"px";
      star[c].style.clip="rect(0px, 5px, 5px, 0px)";
      star[c].childNodes[0].style.backgroundColor=star[c].childNodes[1].style.backgroundColor=(colour=="random")?newColour():colour;
      star[c].style.visibility="visible";
      starv[c]=50;
      break;
    }
  }
  for (c=0; c<sparkles; c++) {
    if (starv[c]) update_star(c);
    if (tinyv[c]) update_tiny(c);
  }
  setTimeout("sparkle()", 40);
}

function update_star(i) {
  if (--starv[i]==25) star[i].style.clip="rect(1px, 4px, 4px, 1px)";
  if (starv[i]) {
    stary[i]+=1+Math.random()*3;
    starx[i]+=(i%5-2)/5;
    if (stary[i]<shigh+sdown) {
      star[i].style.top=stary[i]+"px";
      star[i].style.left=starx[i]+"px";
    } else {
      star[i].style.visibility="hidden";
      starv[i]=0; return;
    }
  } else {
    tinyv[i]=50;
    tiny[i].style.top=(tinyy[i]=stary[i])+"px";
    tiny[i].style.left=(tinyx[i]=starx[i])+"px";
    tiny[i].style.width="2px";
    tiny[i].style.height="2px";
    tiny[i].style.backgroundColor=star[i].childNodes[0].style.backgroundColor;
    star[i].style.visibility="hidden";
    tiny[i].style.visibility="visible";
  }
}

function update_tiny(i) {
  if (--tinyv[i]==25) {
    tiny[i].style.width="1px";
    tiny[i].style.height="1px";
  }
  if (tinyv[i]) {
    tinyy[i]+=1+Math.random()*3;
    tinyx[i]+=(i%5-2)/5;
    if (tinyy[i]<shigh+sdown) {
      tiny[i].style.top=tinyy[i]+"px";
      tiny[i].style.left=tinyx[i]+"px";
    } else {
      tiny[i].style.visibility="hidden";
      tinyv[i]=0; return;
    }
  } else tiny[i].style.visibility="hidden";
}

document.onmousemove=mouse;
function mouse(e) {
  if (e) { y=e.pageY; x=e.pageX; }
  else { set_scroll(); y=event.y+sdown; x=event.x+sleft; }
}

window.onscroll=set_scroll;
function set_scroll() {
  if (typeof(self.pageYOffset)=='number') { sdown=self.pageYOffset; sleft=self.pageXOffset; }
  else if (document.body && (document.body.scrollTop || document.body.scrollLeft)) { sdown=document.body.scrollTop; sleft=document.body.scrollLeft; }
  else if (document.documentElement && (document.documentElement.scrollTop || document.documentElement.scrollLeft)) { sleft=document.documentElement.scrollLeft; sdown=document.documentElement.scrollTop; }
  else { sdown=0; sleft=0; }
}

window.onresize=set_width;
function set_width() {
  var sw_min=999999; var sh_min=999999;
  if (document.documentElement && document.documentElement.clientWidth) {
    if (document.documentElement.clientWidth>0) sw_min=document.documentElement.clientWidth;
    if (document.documentElement.clientHeight>0) sh_min=document.documentElement.clientHeight;
  }
  if (typeof(self.innerWidth)=='number' && self.innerWidth) {
    if (self.innerWidth>0 && self.innerWidth<sw_min) sw_min=self.innerWidth;
    if (self.innerHeight>0 && self.innerHeight<sh_min) sh_min=self.innerHeight;
  }
  if (document.body.clientWidth) {
    if (document.body.clientWidth>0 && document.body.clientWidth<sw_min) sw_min=document.body.clientWidth;
    if (document.body.clientHeight>0 && document.body.clientHeight<sh_min) sh_min=document.body.clientHeight;
  }
  if (sw_min==999999 || sh_min==999999) { sw_min=800; sh_min=600; }
  swide=sw_min; shigh=sh_min;
}

function createDiv(height, width) {
  var div=document.createElement("div");
  div.style.position="absolute";
  div.style.height=height+"px";
  div.style.width=width+"px";
  div.style.overflow="hidden";
  return (div);
}

function newColour() {
  var c=new Array();
  c[0]=255;
  c[1]=Math.floor(Math.random()*256);
  c[2]=Math.floor(Math.random()*(256-c[1]/2));
  c.sort(function(){return (0.5 - Math.random());});
  return ("rgb("+c[0]+", "+c[1]+", "+c[2]+")");
}
// ]]>
</script>
</head>
<body>

  <div id="sidebar-container"></div>
  <script>
    fetch('sidebar.html')
      .then(r => r.text())
      .then(d => { document.getElementById('sidebar-container').innerHTML = d; });
  </script>

  <div class="page-container">
    <main id="main-content">
      <section><h2>Greenhouse</h2><hr><br></section>
      <div id="greenhouse-sections"></div>
    </main>
  </div>

  <footer align="center">
    <br><a href="https://callmecatherine.neocities.org/"><img src="assets/backtohome.gif"></a><br>
  </footer>

<script>
  // ── Page-level resize settings ──
  const PAGE_MAX = 200;
  const PAGE_MIN = 50;

  function resizeImage(img) {
    const w = img.naturalWidth, h = img.naturalHeight;
    if (!w || !h) return;
    const scaleDown = Math.min(PAGE_MAX/w, PAGE_MAX/h, 1);
    const scaleUp   = Math.max(PAGE_MIN/w, PAGE_MIN/h, 1);
    const scale = (w > PAGE_MAX || h > PAGE_MAX) ? scaleDown : (w < PAGE_MIN || h < PAGE_MIN) ? scaleUp : 1;
    img.style.width  = (w * scale) + "px";
    img.style.height = (h * scale) + "px";
  }

  function attachResize(img) {
    if (img.naturalWidth > 0) { resizeImage(img); }
    else if (img.complete)    { setTimeout(() => attachResize(img), 50); }
    else                      { img.onload = () => resizeImage(img); }
  }

  function renderArray(array, containerId) {
    const container = document.getElementById(containerId);
    if (!container) return;
    let row = document.createElement("div");
    row.className = "row";
    container.appendChild(row);
    array.forEach(item => {
      if (item.break) {
        row = document.createElement("div");
        row.className = "row";
        container.appendChild(row);
        return;
      }
      const link = document.createElement("a");
      link.href = item.href || "#";
      link.target = "_blank";
      const img = document.createElement("img");
      img.src = item.src;
      img.alt = item.alt || "";
      attachResize(img);
      link.appendChild(img);
      row.appendChild(link);
    });
  }

  // ── Common hrefs ──
  const aw = 'https://artwork.neocities.org';
  const gh = 'https://gifcities.org/';
  const pb = 'https://pixelbank.neocities.org';
  const pw = 'https://pixel-world.tumblr.com';
  const px = 'https://p-i-x-e-l-s.tumblr.com';
  const mb = 'https://myblinkie.holidaycomments.com/gallery';

  // ── Base path ──
  const BASE = 'pixels/greenhouse/';

  // Helper: convert filename-only arrays to full {href, src, alt} objects
  function fromFiles(files, href) {
    return files.map(f => ({ href, src: BASE + f, alt: f.replace(/\.[^.]+$/, '') }));
  }

  const flowers = fromFiles([
    'divflowera16.gif','lacroixdaisy.gif','lacroixtulip.gif','tulip2.gif','rosa.gif',
    'ikflower08-pinkrose.gif','carnations.png','miniflorzinha.gif','mini066.gif','mini132.gif',
    'mini2.gif','artworkneocities (21).gif','artworkneocities (30).gif','artworkneocities (63).gif',
    'artworkneocities (64).gif','artworkneocities (68).gif','artworkneocities (70).gif',
    'artworkneocities (76).gif','artworkneocities (77).gif','artworkneocities (84).gif',
    'p-i-x-e-l-stumblr (11).gif','p-i-x-e-l-stumblr (12).gif','p-i-x-e-l-stumblr (17).gif',
    'p-i-x-e-l-stumblr (7).gif','p-i-x-e-l-stumblr (9).gif','darosamaple_sm.png','flower_crate.png',
    { href:'https://web.archive.org/web/20060527122705/http://died.altervista.org/
', src:'pixels/dolls/doll030.gif', alt:'died_rosarossa.gif' },
  ], aw);

  const potted = fromFiles([
    '0coinplant.png','0monstera.png','4peacelily.png','4violet.png','artworkneocities (3).png',
    'plant1-1.png','artworksucculent.gif','2plant1.gif','2plant5.gif','miniverdura.gif',
    'planta.gif','sprout4.gif','PothosVineTop.png','pixel-worldTUMBLR (2).webp',
    'pixel-worldTUMBLR (3).webp','pixel-worldTUMBLR (4).webp','pixel-worldTUMBLR (5).webp',
    'pixel-worldTUMBLR (6).webp','pixel-worldTUMBLR (7).webp','pixel-worldTUMBLR (8).webp',
    'pixel-worldTUMBLR (9).webp',
  ], pw);

  const trees = fromFiles([
    'bonsai3.gif','TreeStump.gif','grass1.gif',
    'd9kfjom-ccb129ee-45b2-49bc-a37f-c9031b84a77e.png',
    'tumblr_c014b7436bf6af14fb7caf5aca144b46_8173e5b9_250.png',
    'tumblr_da47253757e47d0c0ca6647ee67acf3a_0ff5346c_250.png',
    'tumblr_inline_o9aoelzNQU1reem51_100.png',
    'd4zkzjc-1c8e16c8-d1f7-4b68-a54a-4fc25a494073.gif',
    'pixelbankneocities (24).gif','pixelbankneocities (47).gif','dalunamoth_sm.png',
  ], pb);

  const bugs = fromFiles([
    'butterfly.gif','butterfly_l1_hunny_dot_sunnyday_dot.gif','borbo.gif','bee.gif',
    'bee_001.gif','caracol.gif','2sCaterpillar.gif','garden-frog-lily-pad.gif','196.gif','27.gif',
  ], aw);

  // Fixed: was referencing T+'greenhouse/...' (double path) and had a syntax error
  const mushrooms = [
    { href:mb,  src:BASE+'mushroom.gif',    alt:'mushroomingrass' },
    { href:aw,  src:BASE+'kinoko16.gif',    alt:'kinoko16' },
    { href:aw,  src:BASE+'th_mini108.gif',  alt:'th_mini108' },
    { href:aw,  src:BASE+'th_mini065.gif',  alt:'th_mini065' },
  ];

  const veggies = fromFiles([
    'corn.gif','potato.gif','turnip.gif','garlic1.gif','icon-carrot.gif',
    '2blueberries.png','watermelon.gif','water_can.gif','gnome2.gif','gnome3.gif',
    'sign2.gif','sign4.gif',
  ], aw);

  const greenhouseSections = [
    { label: "Flowers & Blooms",  items: flowers },
    { label: "Potted Plants",     items: potted },
    { label: "Trees & Greenery",  items: trees },
    { label: "Bugs & Critters",   items: bugs },
    { label: "Mushrooms & Fungi", items: mushrooms },
    { label: "Veggie Garden",     items: veggies },
    { label: "Unsorted", items: [
      { href:"https://cinni.net/?z=/toybox/ani",                                          src:BASE+'neskaya.net_strawb13.gif', alt:'' },
      { href:"https://cinni.net/?z=/toybox/ani",                                          src:BASE+'neskaya.net_frog5.gif',    alt:'' },
      { href:"https://web.archive.org/web/20100419011152/http://neskaya.net/pixels.php?", src:BASE+'pix (2).gif',              alt:'' },
      { href:gh,                                                                           src:BASE+'adoptedpixelredapple.gif', alt:'' },
    ]},
  ];

  window.addEventListener("DOMContentLoaded", () => {
    const container = document.getElementById('greenhouse-sections');
    greenhouseSections.forEach(({ label, items }, idx) => {
      if (idx > 0) {
        const divider = document.createElement('div');
        divider.innerHTML = '<br><hr><br>';
        container.appendChild(divider);
      }
      const id = 'shelf-' + label.replace(/\W+/g, '-').toLowerCase();
      const sec = document.createElement('section');
      const letters = label.split('').map((c, i) =>
        c === ' ' ? `<span style="display:inline-block;width:5px"></span>`
                  : `<span class="letter" style="--i:${i}">${c}</span>`
      ).join('');
      sec.innerHTML = `<div class="section-title">${letters}</div><div id="${id}"></div>`;
      container.appendChild(sec);
      renderArray(items, id);
    });
  });
</script>

</body>
</html>
