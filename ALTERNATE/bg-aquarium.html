<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CallMeCatherine — Aquarium</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;width:100%;}
body{
  font-family:'Nunito',sans-serif;
  background:linear-gradient(180deg,#0a2a5e 0%,#0d3d7a 20%,#0e5090 45%,#0d6aaa 70%,#0c80c0 100%);
  min-height:100vh;
  position:relative;
  overflow-x:hidden;
}
@keyframes rise{from{transform:translateY(0);opacity:0.65;}to{transform:translateY(-100vh);opacity:0;}}
#bubbles,#seabed{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;}
#bubbles{z-index:1;}
#seabed{z-index:2;}
.page-content{position:relative;z-index:3;}
</style>
</head>
<body>
<div id="bubbles"></div>
<div id="seabed"></div>
<div class="page-content">
  <!-- YOUR PAGE CONTENT GOES HERE -->
</div>
<script>
(function(){
  // Bubbles
  const bubCont=document.getElementById('bubbles');
  for(let i=0;i<22;i++){
    const b=document.createElement('div');
    const sz=2+Math.random()*5;
    b.style.cssText=`position:absolute;width:${sz}px;height:${sz}px;border-radius:50%;border:1px solid rgba(255,255,255,0.5);left:${Math.random()*100}%;bottom:${Math.random()*20}%;animation:rise ${4+Math.random()*6}s linear infinite ${-Math.random()*9}s;`;
    bubCont.appendChild(b);
  }
  // Sandy bottom
  const seabed=document.getElementById('seabed');
  const sand=document.createElement('div');
  sand.style.cssText='position:absolute;bottom:0;left:0;width:100%;height:48px;background:linear-gradient(180deg,#d4a84b,#b8882a);border-radius:6px 6px 0 0;';
  seabed.appendChild(sand);
  // Coral shapes
  const coralData=[
    {x:'5%',col:'#e06080',h:55},{x:'12%',col:'#ff8040',h:42},
    {x:'72%',col:'#ff6090',h:60},{x:'82%',col:'#e05050',h:48},
    {x:'90%',col:'#ff7060',h:38},{x:'55%',col:'#e08050',h:44},
  ];
  coralData.forEach(c=>{
    const el=document.createElement('div');
    el.style.cssText=`position:absolute;bottom:44px;left:${c.x};width:14px;height:${c.h}px;background:${c.col};border-radius:8px 8px 3px 3px;`;
    // branch tips
    el.innerHTML=`
      <div style="position:absolute;top:0;left:-8px;width:10px;height:${Math.round(c.h*0.45)}px;background:${c.col};border-radius:6px 6px 0 0;transform:rotate(-20deg);transform-origin:bottom center;"></div>
      <div style="position:absolute;top:0;right:-8px;width:10px;height:${Math.round(c.h*0.45)}px;background:${c.col};border-radius:6px 6px 0 0;transform:rotate(20deg);transform-origin:bottom center;"></div>`;
    seabed.appendChild(el);
  });
  // Seaweed
  [8,20,35,65,88].forEach(x=>{
    const sw=document.createElement('div');
    const h=50+Math.random()*40;
    sw.style.cssText=`position:absolute;bottom:44px;left:${x}%;width:8px;height:${h}px;background:#20a050;border-radius:4px 4px 0 0;animation:sway ${2+Math.random()*2}s ease-in-out infinite ${-Math.random()*2}s;transform-origin:bottom center;`;
    seabed.appendChild(sw);
  });
})();
</script>
<style>
@keyframes sway{0%,100%{transform:rotate(-10deg);}50%{transform:rotate(10deg);}}
</style>
</body>
</html>
